name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_unsigned:
        description: 'Upload unsigned release candidate'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build and check Windows executable
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test and publish
        shell: pwsh
        run: ./build.ps1
      - name: Check Windows modes
        shell: pwsh
        run: ./tests/WindowsModes.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'goodsort-mode-checks')
      - name: Verify executable and record build evidence
        shell: pwsh
        run: ./tools/Verify-Release.ps1
      # Candidate upload is explicitly enabled for a reviewed release build.
      # No signing credentials, release uploads, or paid runners are used here.
      - name: Upload unsigned candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.upload_unsigned
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GoodSort-PDF-unsigned-${{ github.run_id }}
          path: dist/GoodSort PDF.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload build evidence
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GoodSort-PDF-evidence-${{ github.run_id }}
          path: |
            test-output/build-manifest.json
            test-output/SHA256SUMS.txt
            ${{ runner.temp }}/goodsort-mode-checks/results.json
          if-no-files-found: error
          retention-days: 1
